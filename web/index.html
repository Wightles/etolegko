<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тест скорости интернета</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <h1>Тест скорости интернета</h1>
      </section>

      <section class="panel setup-panel">
        <form id="speed-form" class="speed-form">
          <label for="url-input">URL</label>
          <div class="input-row">
            <input
              id="url-input"
              name="url"
              type="url"
              placeholder="https://example.com/large-file.bin"
              autocomplete="url"
              required
            />
            <button id="start-button" type="submit">Проверить</button>
          </div>
        </form>
      </section>

      <section class="panel progress-panel">
        <div class="progress-heading">
          <h2>Запросы</h2>
          <strong id="progress-label">0/10</strong>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="request-list" class="request-list" aria-live="polite"></div>
      </section>

      <section class="results">
        <div class="results-heading">
          <h2>Результат</h2>
        </div>
        <div class="metric-grid">
          <article class="metric-card metric-card-primary">
            <p>Средняя скорость</p>
            <strong id="speed-result">0.00</strong>
            <span>MiB/s</span>
          </article>
          <article class="metric-card">
            <p>Среднее время</p>
            <strong id="time-result">0.000</strong>
            <span>секунд</span>
          </article>
          <article class="metric-card">
            <p>Скачано всего</p>
            <strong id="size-result">0.00</strong>
            <span>MiB</span>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
